name: ci Tests - testHub

on:
  push:
    branches: [ main ]

jobs:
  trigger-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger testHub Workflow_Tests
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TH_TOKEN_PAT }}
          repository: raymondskkb/test-hub
          event-type: run-tests
          client-payload: '{"project":"merchant-portal-ui-tests"}'
# Job to listen for the result of the triggered workflow run
  wait-for-tests:
    runs-on: ubuntu-latest
    needs: trigger-tests
    steps:
      - name: Wait for testHub test run to complete
        uses: peter-evans/workflow-run@v1
        with:
          token: ${{ secrets.TH_TOKEN_PAT }}
          repository: raymondskkb/test-hub
          workflow: "merchant-portal-ui-tests.yml"
          status: "success"
