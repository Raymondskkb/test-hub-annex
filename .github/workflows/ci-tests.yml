name: ci Tests - testHub

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ test-results ]
  workflow_dispatch:

jobs:
  trigger-tests:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger testHub Workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.TH_TOKEN_PAT }}
          repository: raymondskkb/test-hub
          event-type: run-tests
          client-payload: |
            {
              "project": "merchant-portal-ui-tests",
              "source_repo": "${{ github.repository }}",
              "source_run_id": "${{ github.run_id }}"
            }

  handle-test-result:
    if: github.event_name == 'repository_dispatch' && github.event.action == 'test-results'
    runs-on: ubuntu-latest
    steps:
      - name: Print test result
        run: |
          echo "Status: ${{ github.event.client_payload.status }}"
          echo "Run:    ${{ github.event.client_payload.run_url }}"
          echo ""
          echo "🧪 View Playwright Report:"
          echo "${{ github.event.client_payload.run_url }} (Artifacts → ${{ github.event.client_payload.artifact }})"

      - name: Write test summary
        run: |
          {
            echo "## 🧪 Merchant Portal UI Tests"
            echo ""
            echo "**Status:** ${{ github.event.client_payload.status }}"
            echo ""
            echo "🔗 **[View Playwright Report](${{ github.event.client_payload.run_url }})**"
            echo ""
            echo "_Open the run → Artifacts → **${{ github.event.client_payload.artifact }}**_"
          } >> $GITHUB_STEP_SUMMARY

      - name: Fail if tests failed
        if: ${{ github.event.client_payload.status != 'success' }}
        run: exit 1
